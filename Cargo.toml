[workspace]
resolver = "2"
members = ["edge-core", "edge-macros", "edge-fastly", "edge-cloudflare", "examples/hello-world", "tests/conformance"]
# Service crates require an explicit platform feature (SPEC §6.2: neither
# feature is a compile error), so the default root build covers the library
# crates only.
default-members = ["edge-core", "edge-macros", "edge-fastly", "edge-cloudflare", "tests/conformance"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
bytes = "1.10"
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["rt", "macros"] }
url = "2.5"
