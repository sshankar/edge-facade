[package]
name = "edge-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "`#[edge::main]` entry macro for the Edge SDK"

[lib]
proc-macro = true

# No-op features: used only by trybuild to exercise the entry macro's
# feature matrix (SPEC §6.2) in the harness crate.
[features]
fastly = []
cloudflare = []

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
trybuild = "1.0"
edge-core = { path = "../edge-core" }
edge-cloudflare = { path = "../edge-cloudflare" }
edge-fastly = { path = "../edge-fastly" }
wasm-bindgen = "0.2"
