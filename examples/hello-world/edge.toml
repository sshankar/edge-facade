# edge.toml — single source of truth (SPEC §7.2). edge-cli (M5) generates
# wrangler.toml + fastly.toml from this; the same content is embedded in the
# binary for runtime resolution.

[service]
name = "hello-world"

[origins]
# Declared origins become fetchable hosts. `backend` must match the backend
# generated into fastly.toml (SPEC §7.2).
# api = { url = "https://api.example.com", backend = "api_backend" }

[stores]
# M4: the `default` KV handle and `Context::var` resolve through this
# binding; the greeting is config-driven (GREETING in the config store /
# wrangler binding).
kv = "hello_kv"
config = "hello_config"

[logging]
endpoint = "hello_logging"

[fastly]
# Fail-closed default: undeclared fetch hosts are an error unless dynamic
# backends are explicitly enabled (SPEC D4). MUST be explicit.
dynamic_backends = false
