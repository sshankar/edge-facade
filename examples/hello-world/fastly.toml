# fastly.toml for hello-world — hand-maintained for M1; edge-cli (M5)
# generates the `[setup]` section from edge.toml. `[local_server]` is read
# by Viceroy.

name = "hello-world"
description = "One handler, deployed to both Cloudflare Workers and Fastly Compute"
authors = ["edge"]
language = "rust"

[local_server]

# M4: config-driven greeting — GREETING lives here (Viceroy), in the workerd
# binding, and in wrangler.toml (M5 codegen).
[local_server.config_stores]
hello_config = { format = "inline-toml", contents = { GREETING = "Hi" } }

# ---- Deployment bootstrapping (fastly CLI; generated by edge-cli in M5) ----
[setup]
backends = {}
kv_store = { name = "hello_kv" }
config_store = { name = "hello_config" }

[logging]
hello_logging = { name = "hello_logging" }
