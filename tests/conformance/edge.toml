# edge.toml — single source of truth for the conformance service (SPEC §7.2).
# Embedded in the binary at build time by #[edge_core::main].

[service]
name = "conformance"

[origins]
# Declared origin for T4 (Host-parity test). The backend must match
# fastly.toml ([local_server.backends] for Viceroy; [setup.backends] when
# generated for deployment).
api = { url = "http://api.example.com", backend = "api_backend" }
# T6 error-surface origin: resolves to a backend whose port refuses
# connections (Viceroy: refused_backend -> 127.0.0.1:19999; workerd: the T6
# instance's dead globalOutbound). The fetch must surface as `Connection`.
refused = { url = "http://refused.example.com:19999", backend = "refused_backend" }

[stores]
# T7/T8 (vars/secrets/KV, M4): bindings resolved by each adapter — Viceroy
# via [local_server.config_stores|secret_stores|kv_stores], workerd via
# bindings + a kvNamespace service (same local origin).
kv = "edge_kv"
config = "edge_config"
secrets = "edge_secrets"

[logging]
endpoint = "conformance_logging"

[fastly]
dynamic_backends = false
