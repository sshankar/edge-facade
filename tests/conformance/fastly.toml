# fastly.toml for the conformance suite — hand-maintained for M1.
# edge-cli (M5) generates `[setup]` from edge.toml; `[local_server]` is read
# by Viceroy (https://developer.fastly.com/reference/fastly-toml/#local-server).

name = "conformance"
description = "Edge SDK conformance suite"
authors = ["edge"]
language = "rust"

[local_server]

# T4 origin: a local echo server standing in for api.example.com. The
# override_host implements parity rule D5.1 (origin sees Host: <URL host>).
[local_server.backends]
api_backend = { url = "http://127.0.0.1:18080", override_host = "api.example.com" }
# T6 origin: nothing listens on 19999, so the send is refused and must
# surface as FetchError::Connection (SPEC §11 T6).
refused_backend = { url = "http://127.0.0.1:19999" }

# ---- Deployment bootstrapping (fastly CLI; generated by edge-cli in M5) ----
[setup]
backends = { api_backend = { target = "api.example.com", override_host = "api.example.com", use_ssl = false } }
kv_store = { name = "edge_kv" }

[logging]
conformance_logging = { name = "conformance_logging" }
